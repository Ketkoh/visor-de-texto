name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK platform
        run: sdkmanager --channel=1 "platforms;android-37.0"

      - name: Grant execute permission to Gradle
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew test --no-daemon

      - name: Build Android application
        run: ./gradlew assembleDebug --no-daemon

      - name: Guard merged manifests against forbidden permissions and backup (K-34)
        run: |
          MANIFESTS=$(find app/build/intermediates/merged_manifests -type f -name "AndroidManifest.xml")
          if [ -z "$MANIFESTS" ]; then
            echo "ERROR: No se encontro ningun AndroidManifest.xml combinado."
            exit 1
          fi

          echo "=== Permisos encontrados en manifiestos combinados ==="
          grep -Hn "uses-permission" $MANIFESTS || echo "(Ninguno)"

          if grep -E "android\.permission\.(INTERNET|READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE|MANAGE_EXTERNAL_STORAGE|READ_MEDIA_[A-Z0-9_]+)" $MANIFESTS | grep -v "DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION"; then
            echo "ERROR: Se detecto un permiso prohibido en el manifiesto combinado."
            exit 1
          fi

          if grep -F 'android:allowBackup="true"' $MANIFESTS; then
            echo "ERROR: Se detecto android:allowBackup=\"true\" en el manifiesto combinado."
            exit 1
          fi

          echo "OK: Manifiesto verificado sin permisos prohibidos ni allowBackup=true."
